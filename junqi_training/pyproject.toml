[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "junqi-bot"
version = "0.1.0"
description = "A trainable, single-player Junqi prototype"
requires-python = ">=3.10"

[project.scripts]
junqi = "junqi.cli:main"
junqi-train = "junqi.training:main"
junqi-train-layout = "junqi.layout_training:main"

[tool.setuptools.packages.find]
include = ["junqi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
